<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DocIA</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
      font-family: 'Segoe UI', sans-serif;
      color: #ffffff;
    }

    .header {
      background: linear-gradient(90deg, #6b2fb5 0%, #8b3fd9 100%);
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
    }

    .logo-accent { color: #00ff88; }

    .subtitle {
      font-size: 11px;
      color: #e8ddf5; /* contrast ratio ~7.5:1 over #8b3fd9 header — WCAG AA */
      margin-top: 5px;
      text-transform: uppercase;
    }

    .content { padding: 24px; }

    .info-badge {
      background: rgba(107, 47, 181, 0.3);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 12px;
      line-height: 1.3;
    }

    .form-group { margin-bottom: 14px; }

    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #d4bff0; /* contrast ratio ~5.1:1 over dark purple bg — WCAG AA */
    }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #8b3fd9;
      pointer-events: none;
    }

    .input {
      width: 100%;
      padding: 14px 14px 14px 45px;
      background: #241340; /* opaque equivalent of rgba(255,255,255,0.05) over #1a0b2e — contrast #fff/#241340 = 14.5:1 */
      border: 2px solid rgba(139, 63, 217, 0.3);
      border-radius: 10px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input::placeholder { color: rgba(255,255,255,0.75); } /* ~4.8:1 over dark bg — WCAG AA */

    .input:focus {
      border-color: rgba(0, 255, 136, 0.6);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: transform 0.08s ease, opacity 0.15s ease;
      user-select: none;
    }

    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(90deg, #00ff88 0%, #00d97e 100%);
      color: #1a0b2e;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.35);
    }

    .btn-secondary {
      background: #251543; /* opaque equivalent of rgba(255,255,255,0.06) over #1a0b2e — contrast #fff/#251543 = 14.1:1 */
      color: #ffffff;
      border: 2px solid rgba(139, 63, 217, 0.35);
    }

    .helper {
      margin-top: 8px;
      font-size: 11px;
      color: #d4bff0; /* contrast ratio ~5.1:1 over dark purple bg — WCAG AA */
      line-height: 1.35;
    }

    .status-container { display: none; margin-top: 18px; }
    .status-container.active { display: block; }

    .status-box {
      background: rgba(107, 47, 181, 0.2);
      border: 2px solid #8b3fd9;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(139, 63, 217, 0.3);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #00ff88;
      width: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .footer {
      padding: 12px;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      font-size: 10px;
      color: #ffffff; /* full white — WCAG AA over dark bg */
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">DOC<span class="logo-accent">IA</span></div>
    <div class="subtitle">Gerador de Requisitos com IA</div>
  </div>

  <div class="content">

    <div id="main-content">

      <div class="info-badge">
        🤖 Capture uma interface e receba automaticamente a documentação técnica no Slack.
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="label" for="userEmail">📧 Seu E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            id="userEmail"
            class="input"
            type="email"
            placeholder="seu@email.com"
            autocomplete="email"
            maxlength="120"
            required
          />
        </div>
      </div>

      <!-- Webhook -->
      <div class="form-group">
        <label class="label" for="webhookUrl">🔗 URL do Webhook (n8n)</label>
        <div class="input-wrapper">
          <span class="input-icon">🔗</span>
          <input
            id="webhookUrl"
            class="input"
            type="url"
            placeholder="https://seu-n8n.com/webhook/docia-webhook"
            autocomplete="off"
            spellcheck="false"
            required
          />
        </div>
        <div class="helper">
          Após importar o workflow no n8n, copie a URL do Webhook e cole aqui.
        </div>
      </div>

      <!-- Buttons -->
      <div class="btn-row">
        <button id="saveWebhook" class="btn btn-secondary" type="button">
          💾 Salvar Webhook
        </button>

        <button id="btnCapture" class="btn btn-primary" type="button">
          📸 Gerar Requisitos
        </button>
      </div>

    </div>

    <!-- Status -->
    <div id="statusArea" class="status-container" aria-live="polite">
      <div class="status-box">
        <div id="statusIcon" style="font-size: 30px;">⚡</div>
        <div id="statusText" style="margin-top:10px;">Processando...</div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    Desenvolvido por H2 Lab
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
