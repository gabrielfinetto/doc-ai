<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%); font-family: 'Segoe UI', sans-serif; color: #ffffff; }
    .header { background: linear-gradient(90deg, #6b2fb5 0%, #8b3fd9 100%); padding: 20px; text-align: center; position: relative; overflow: hidden; }
    .logo { font-size: 28px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 20px rgba(0, 255, 136, 0.6); }
    .logo-accent { color: #00ff88; }
    .subtitle { font-size: 11px; color: #b8a4d4; margin-top: 5px; text-transform: uppercase; }
    .content { padding: 24px; }
    .info-badge { background: rgba(107, 47, 181, 0.3); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 8px; padding: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .form-group { margin-bottom: 20px; }
    .label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #b8a4d4; }
    .input-wrapper { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8b3fd9; }
    .input { width: 100%; padding: 14px 14px 14px 45px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(139, 63, 217, 0.3); border-radius: 10px; color: #ffffff; }
    .btn-capture { width: 100%; padding: 16px; background: linear-gradient(90deg, #00ff88 0%, #00d97e 100%); border: none; border-radius: 12px; color: #1a0b2e; font-weight: 700; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4); }
    .status-container { display: none; margin-top: 20px; }
    .status-container.active { display: block; }
    .status-box { background: rgba(107, 47, 181, 0.2); border: 2px solid #8b3fd9; border-radius: 12px; padding: 20px; text-align: center; }
    .progress-bar { width: 100%; height: 6px; background: rgba(139, 63, 217, 0.3); border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: #00ff88; width: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .footer { padding: 12px; text-align: center; background: rgba(0, 0, 0, 0.3); font-size: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">DOC<span class="logo-accent">IA</span></div>
    <div class="subtitle">Gerador de Requisitos com IA</div>
  </div>

  <div class="content">
    <div id="main-content">
      <div class="info-badge">🤖 Capture e receba um documento técnico no Slack!</div>
      <div class="form-group">
        <label class="label">📧 Seu E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input id="userEmail" class="input" type="email" placeholder="seu@email.com">
        </div>
      </div>
      <button id="btnCapture" class="btn-capture">📸 Gerar Requisitos</button>
    </div>

    <div id="statusArea" class="status-container">
      <div class="status-box">
        <div id="statusIcon" style="font-size: 30px;">⚡</div>
        <div id="statusText" style="margin-top:10px;">Processando...</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
    </div>
  </div>

  <div class="footer">Desenvolvido por Lab de IA - H2</div>
  
  <script src="popup.js"></script>
</body>
</html>
